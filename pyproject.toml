[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-instagram-organizer"
version = "0.2.0"
description = "AI-powered toolkit that turns unsorted photo libraries into Instagram-ready carousel posts"
readme = "README.md"
license = "MIT"
authors = [{name = "Summit Singh Thakur"}]
requires-python = ">=3.10"
dependencies = [
    "pillow==11.3.0",
    "pillow-heif==1.1.0",
    "ImageHash==4.3.2",
    "numpy==2.2.6",
    "requests==2.32.5",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
optional = [
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "pandas==2.3.2",
    "opencv-python==4.12.0.88",
    "scipy==1.16.2",
    "joblib==1.5.2",
    "nltk==3.9.1",
    "textblob",
    "scikit-learn",
]

[project.scripts]
ai-instagram-organizer = "organizer.cli:main"
trip-dump = "trip_dumps.__main__:main"

[project.urls]
Homepage = "https://github.com/summitsingh/ai-instagram-organizer"

[tool.hatch.build]
exclude = [
    "**/__pycache__/",
    "**/*.pyc",
    "temp_converted_images_*/",
    "instagram_posts_*/",
    "**/*-work/",
    "options/",
    "dist/",
]

[tool.hatch.build.targets.wheel]
only-include = ["organizer", "trip_dumps", "reels", "features", "ai_instagram_organizer.py"]

[tool.hatch.build.targets.sdist]
only-include = [
    "organizer",
    "trip_dumps",
    "reels",
    "features",
    "ai_instagram_organizer.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "requirements.txt",
    "requirements-optional.txt",
    "docs",
    "skills/instagram-trip-dumps",
    "pyproject.toml",
]

# pytest configuration: offline unit tests only live under tests/.
# The legacy live-API scripts in tests/ (test_gemini_*, test_llama_*, ...) are
# NOT collected here; CI runs the offline files explicitly.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.ruff.lint]
# Pinned to ruff's classic default set: syntax errors, pyflakes, and the
# pycodestyle error subsets. Keeps the CI gate stable across ruff versions
# without forcing style churn on pre-existing code.
select = ["E4", "E7", "E9", "F"]
